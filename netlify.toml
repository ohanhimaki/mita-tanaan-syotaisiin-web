[build]
  command = "bash build.sh"
  publish = "release/wwwroot"

[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[[redirects]]
  from = "/curl"
  to = "/.netlify/edge-functions/curl"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
# local dev command directory
  port = 8888

  # Local dev command. A.k.a npm start
  #command = "dotnet watch run --project ./src/mts.web/mts.web.csproj"
